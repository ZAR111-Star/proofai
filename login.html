<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProofAI 登录</title>
    <link rel="stylesheet" href="./commerce.css" />
  </head>
  <body data-page="login">
    <header class="appbar">
      <a class="brand" href="./index.html">
        <span>ProofAI 信证 AI</span>
        <strong>登录</strong>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="./index.html">证据包工具</a>
        <a href="./services.html">服务中心</a>
        <a href="./recharge.html">充值/订单</a>
        <a class="active" href="./login.html">登录</a>
        <a href="./register.html">注册</a>
        <a href="./admin.html">管理后台</a>
      </nav>
    </header>

    <main class="page auth-page">
      <section class="panel auth-card">
        <p class="kicker">Account</p>
        <h1>登录 ProofAI</h1>
        <p class="note">登录后可以购买服务、充值、查看订单，管理员可进入后台查看数据分析和资金流水。</p>
        <form id="loginForm" class="auth-form">
          <label>
            邮箱
            <input name="email" type="email" autocomplete="email" value="admin@proofai.local" required />
          </label>
          <label>
            密码
            <input name="password" type="password" autocomplete="current-password" value="ProofAI@2026!" required />
          </label>
          <button class="btn primary" type="submit">登录</button>
        </form>
        <p class="note">默认管理员：`admin@proofai.local` / `ProofAI@2026!`。上线前必须在 `.env` 里修改。</p>
        <div id="authMessage" class="note"></div>
      </section>
    </main>

    <script src="./auth-guard.js"></script>
    <script src="./auth.js"></script>
  </body>
</html>
